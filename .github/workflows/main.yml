name: Build and Deploy Valkyrie
on:
  push:
    branches:
      - main
      - valkyrie-qt5-qt6
      - test-workflow
  pull_request:
    branches:
      - main
      - valkyrie-qt5-qt6
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qt-config:
          - version: '5.15.*'
            arch: gcc_64
            modules:
    steps:
      - id: install_deps
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip patchelf
          pip3 install appimage-builder
      - id: install_qt
        name: Install Qt using GHA
        uses: jurplel/install-qt-action@v4
        with:
          arch: ${{ matrix.qt-config.arch }}
          version: ${{ matrix.qt-config.version }}
          modules: ${{ matrix.qt-config.modules }}
      - uses: actions/checkout@v4
      - id: compile_application
        name: Build application
        run: |
          mkdir build
          cd build
          qmake ..
          make  -j$(nproc)
      - id: exec_appimagebuilder
        name: Create App Image
        run: |
           appimage-builder --recipe appimage-builder.yml
      - id: upload-artifact
        name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-application
          path: build/
          
  get_latest_tag:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Get latest tag
      id: get_tag
      run:  |
        latest_tag=$(git tag --sort=-creatordate | head -n 1)
        echo "latest_tag=$latest_tag" >> $GITHUB_ENV
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: qt-application
        path: build/
