version: 1

AppDir:
  path: ./AppDir
  app_info:
    id: valkyrie
    name: Valkyrie
    icon: icons/valkyrie.xpm
    version: 1.0.0
    exec: valkyrie
    exec_args: $@
  files:
    include:
      - ./build/valkyrie

AppImage:
  arch: x86_64
  update-information: None
  sign-key: None

RPM:
  name: Valkyrie
  version: 1.0.0
  release: 1
  summary: Valkyrie is a graphical front-end to the Valgrind suite
  license: GPLv2
  files:
    - ./build/valkyrie:/usr/local/bin/valkyrie
  dependencies:
    - qt5-default
    - libqt5widgets5
    - libqt5gui5
    - libqt5core5a
    - libfuse2
